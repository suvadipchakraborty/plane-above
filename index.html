<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plane Above Me – Personal Airspace Radar</title>
<meta name="description" content="Tap once to find the nearest airplane flying over you right now.">
<meta name="theme-color" content="#040b0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Plane Above Me">
<meta property="og:title" content="Plane Above Me – Personal Airspace Radar">
<meta property="og:description" content="Tap once to find the nearest airplane flying over you right now.">
<meta property="og:url" content="https://plane-above.suvadipchakraborty.workers.dev/">
<meta property="og:image" content="https://plane-above.suvadipchakraborty.workers.dev/preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Plane Above Me">
<meta name="twitter:description" content="Find the nearest airplane flying over you right now.">
<meta name="twitter:image" content="https://plane-above.suvadipchakraborty.workers.dev/preview.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <h1>Plane Above Me</h1>
    <p id="status" aria-live="polite">Standing by</p>
  </header>

  <section class="radar" id="radar" aria-label="Radar display">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="cross h"></div><div class="cross v"></div>
    <div class="sweep"></div>
    <div class="me"></div>
    <div class="blip" id="blip" hidden></div>
    <span class="scale s1">17mi</span><span class="scale s2">33mi</span><span class="scale s3">50mi</span>
  </section>

  <button id="scanBtn" class="scan">Scan My Airspace</button>

  <section id="card" class="card" hidden aria-live="polite"></section>

  <div class="tools">
    <button id="installBtn" hidden>Save App</button>
    <button id="shareBtn" hidden aria-label="Share discovery">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      Share
    </button>
  </div>
</main>
<footer>Built by Suva · <a href="mailto:suvadipchakraborty@gmail.com?subject=Plane%20Above%20Me%20feedback">Send feedback</a></footer>
<script src="app.js"></script>
</body>
</html>
